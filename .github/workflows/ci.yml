name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # TS 7 runs 4 type-check workers by default; pin it for small CI runners.
      - run: npx tsc --noEmit --checkers 2
      - run: npm test
      - run: npx vite build
