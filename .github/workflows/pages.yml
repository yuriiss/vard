# Publishes the app to GitHub Pages (https://<owner>.github.io/<repo>/) on every push to the
# default branch. If the first run fails at "Configure Pages", switch Pages on once under
# Settings → Pages → Build and deployment → Source: "GitHub Actions" and re-run.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/dp-fmea-schedule-platform-pf5if1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci
      - run: npm test
      - run: npx vite build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
